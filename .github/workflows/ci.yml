# CI for lalanikarim/engram.
#
# Why this file exists: branch protection on `main` requires the status check context
# "unit-suite" (strict), and until now nothing in this repository ever reported it — there was
# no .github/ directory at all, so zero check runs have ever appeared on main. A required check
# that no workflow produces does not fail; it sits "Expected — waiting for status" forever, and
# every pull request becomes unmergeable except by bypass. That is how #70 got stuck.
#
# Scope: only the hermetic subset. `npm run test:unit` needs no model endpoint, no network and
# no container runtime; its sandbox-containment case self-skips where Podman is absent (it does
# not silently pass — it prints SKIP). The full `npm test` in app/ needs network access and stays
# a local command.
#
# Node 24: the suites are run as `node app/test/x.test.ts` with no loader flag, which requires
# native type stripping (Node >= 23; 24 is what the factory sandbox runs too).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job id IS the branch-protection check name ("unit-suite"). Renaming this job orphans the
  # required check and re-creates the stuck-PR condition described above.
  unit-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # #68 fixed: the root lockfile now records every TypeScript platform variant, so a Linux
      # runner installs a real compiler. That is what lets the install step drop `--ignore-scripts`
      # and lets `npm run build` run in CI at all — before the fix, plain `npm ci` died in
      # getExePath.js with "Unable to resolve @typescript/typescript-linux-arm64".
      - name: Install dependencies
        run: npm ci

      # Compiling is the cheapest proof that the platform binary resolved, and it used to be
      # impossible off macOS. Keep it even though the unit suite imports .ts sources directly:
      # a build regression in dist/ output would otherwise only surface in the next release.
      - name: Build
        run: npm run build

      # Hard failure now (it was a warning while #68 was open). If a future lockfile regeneration
      # prunes platform variants again, this fails loudly at install-adjacent cost instead of
      # silently breaking every Linux consumer — the exact class of defect that hid for weeks.
      - name: Lockfile platform coverage (#68)
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const ts = Object.keys(lock.packages ?? {}).filter((k) => k.includes("@typescript/typescript-"));
            const linux = ts.filter((k) => /linux-(x64|arm64)/.test(k));
            console.log("platform entries:", ts.length, "| linux x64/arm64:", linux.join(", ") || "none");
            if (linux.length < 2) {
              console.error("::error title=Lockfile lost Linux TypeScript variants::npm ci cannot build on Linux (#68 regression)");
              process.exit(1);
            }
          '

      - name: Unit suite
        run: npm run test:unit
